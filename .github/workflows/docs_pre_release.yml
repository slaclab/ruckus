name: Pre-release Documentation

concurrency:
  group: gh-pages-publish
  cancel-in-progress: false

on:
  workflow_call:
    secrets:
      GH_TOKEN:
        required: true

permissions:
  contents: write

jobs:
  publish_docs:
    name: Publish Pre-release Docs
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/pre-release'
    env:
      REPO_NAME: ${{ github.event.repository.name }}
      DOCS_SITE_ROOT: /${{ github.event.repository.name }}
    steps:
      - name: Checkout source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "docs/requirements.txt"

      - name: Install documentation dependencies
        run: pip install -r docs/requirements.txt

      - name: Build HTML documentation
        run: sphinx-build -b html -W --keep-going docs/ docs/_build/html

      - name: Prepare gh-pages worktree
        run: |
          rm -rf .tmp/gh-pages
          mkdir -p .tmp
          git fetch origin gh-pages || true
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git worktree add .tmp/gh-pages origin/gh-pages
          else
            git worktree add --detach .tmp/gh-pages
            cd .tmp/gh-pages
            git checkout --orphan gh-pages
            git rm -rf . >/dev/null 2>&1 || true
          fi
          touch .tmp/gh-pages/.nojekyll

      - name: Update published docs tree
        run: |
          python3 scripts/docs_publish.py \
            --site-dir docs/_build/html \
            --output-root .tmp/gh-pages \
            --site-root "${DOCS_SITE_ROOT}" \
            --mode pre-release

      - name: Commit and push
        run: |
          cd .tmp/gh-pages
          git add .
          if git diff --cached --quiet; then
            echo "No gh-pages changes to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish pre-release docs"
          git push origin HEAD:gh-pages
