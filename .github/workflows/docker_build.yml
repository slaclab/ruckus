name: Docker Build for Package

on:
  workflow_call:
    inputs:
      gh_username:
        required: true
        type: string
      docker_name:
        required: true
        type: string
    secrets:
      GH_TOKEN:
        required: true

jobs:
  docker_build:
    name: Docker Build
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/')
    steps:

      # This step checks out a copy of your repository.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Get Image Information
        id: get_image_info
        run: |
          echo "tag=$(git describe --tags)" >> ${GITHUB_OUTPUT}
          echo "branch=$(echo ${GITHUB_REF} | awk 'BEGIN { FS = "/" } ; { print $3 }')" >> ${GITHUB_OUTPUT}

      # Setup docker build environment
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Login to GHCR (GitHub Container Registry) / Docker registry
      - name: Login to GHCR / Docker registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ inputs.gh_username }}
          password: ${{ secrets.GH_TOKEN }}

      # Build and push the docker image
      - name: Build and push image to GHCR / Docker registry
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./docker/${{ inputs.docker_name }}/Dockerfile
          push: true
          tags: ghcr.io/slaclab/${{ inputs.docker_name }}:${{ steps.get_image_info.outputs.tag }}, ghcr.io/slaclab/${{ inputs.docker_name }}:latest
          build-args: branch=${{ steps.get_image_info.outputs.branch }}
